name: sapient_school

description: "The Sapient School Management System"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  provider: ^6.1.5

  google_fonts: ^6.3.1
  flutter_svg: ^2.2.0

  shared_preferences: ^2.5.3
  intl: ^0.20.2
  image_picker: ^1.2.0
  file_picker: ^10.3.2
  url_launcher: ^6.3.2

  http: ^1.5.0

  firebase_core: ^4.12.1
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0

  local_auth: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/icons/
    - assets/images/icons/logos/
    - assets/images/icons/logos/logo.png